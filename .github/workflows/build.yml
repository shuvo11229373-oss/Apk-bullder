name: APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App Name
        required: true
        default: My App
        type: string
      package_name:
        description: Package Name
        required: true
        default: com.example.myapp
        type: string
      website_url:
        description: Website URL
        required: true
        default: https://example.com
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android Project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          WEBSITE_URL: ${{ inputs.website_url }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from xml.sax.saxutils import escape

          name = os.environ["APP_NAME"]
          package = os.environ["PACKAGE_NAME"]
          url = os.environ["WEBSITE_URL"]

          if not re.fullmatch(r'[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+', package):
              raise SystemExit("Invalid package name")

          if not url.startswith("https://"):
              raise SystemExit("HTTPS URL required")

          os.makedirs("app/src/main/res/values", exist_ok=True)

          java_path = "app/src/main/java/" + package.replace(".", "/")
          os.makedirs(java_path, exist_ok=True)

          with open("settings.gradle", "w") as f:
              f.write("""
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "APKMaker"
          include ':app'
          """)

          with open("build.gradle", "w") as f:
              f.write("""
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          """)

          with open("app/build.gradle", "w") as f:
              f.write("""
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '%s'
              compileSdk 35

              defaultConfig {
                  applicationId '%s'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          """ % (package, package))

          with open("app/src/main/res/values/strings.xml", "w") as f:
              f.write(
                  '<resources><string name="app_name">' +
                  escape(name) +
                  '</string><string name="website_url">' +
                  escape(url) +
                  '</string></resources>'
              )

          manifest = """<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""

          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write(manifest)

          java = """package PACKAGE_NAME;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl(getString(PACKAGE_NAME.R.string.website_url));
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """

          java = java.replace("PACKAGE_NAME", package)

          with open(java_path + "/MainActivity.java", "w") as f:
              f.write(java)
          PY

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Download
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
