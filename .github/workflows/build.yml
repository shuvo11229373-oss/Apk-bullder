name: APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App Name
        required: true
        default: My App
        type: string

      package_name:
        description: Package Name
        required: true
        default: com.example.myapp
        type: string

      website_url:
        description: Website URL
        required: true
        default: https://example.com
        type: string

      version_name:
        description: Version Name
        required: true
        default: "1.0"
        type: string

      version_code:
        description: Version Code
        required: true
        default: "1"
        type: string

      permissions:
        description: Android Permissions
        required: true
        default: INTERNET
        type: string

      bg_color:
        description: Background Color
        required: true
        default: "#FFFFFF"
        type: string

      logo_path:
        description: Uploaded Logo Path
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android Project
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          WEBSITE_URL: ${{ inputs.website_url }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          PERMISSIONS: ${{ inputs.permissions }}
          BG_COLOR: ${{ inputs.bg_color }}
          LOGO_PATH: ${{ inputs.logo_path }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import shutil
          from xml.sax.saxutils import escape
          from PIL import Image, ImageDraw, ImageFont

          name = os.environ["APP_NAME"]
          package = os.environ["PACKAGE_NAME"]
          url = os.environ["WEBSITE_URL"]
          version_name = os.environ["VERSION_NAME"]
          version_code = int(os.environ["VERSION_CODE"])
          bg_color = os.environ["BG_COLOR"]
          logo_path = os.environ.get("LOGO_PATH", "").strip()

          if not re.fullmatch(
              r'[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+',
              package
          ):
              raise SystemExit("Invalid package name")

          if not url.startswith("https://"):
              raise SystemExit("HTTPS URL required")

          if version_code < 1:
              raise SystemExit("Invalid version code")

          if not re.fullmatch(r'#[0-9A-Fa-f]{6}', bg_color):
              raise SystemExit("Invalid background color")

          allowed = {"INTERNET", "RECORD_AUDIO"}
          permissions = set(
              p.strip() for p in os.environ["PERMISSIONS"].split(",") if p.strip()
          )
          permissions.add("INTERNET")

          if not permissions.issubset(allowed):
              raise SystemExit("Unsupported permission selected")

          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap-anydpi-v26", exist_ok=True)

          java_path = "app/src/main/java/" + package.replace(".", "/")
          os.makedirs(java_path, exist_ok=True)

          with open("settings.gradle", "w") as f:
              f.write("""
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "APKMaker"
          include ':app'
          """)

          with open("build.gradle", "w") as f:
              f.write("""
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          """)

          with open("app/build.gradle", "w") as f:
              f.write(f"""
          plugins {{
              id 'com.android.application'
          }}

          android {{
              namespace '{package}'
              compileSdk 35

              defaultConfig {{
                  applicationId '{package}'
                  minSdk 23
                  targetSdk 35
                  versionCode {version_code}
                  versionName "{version_name}"
              }}
          }}
          """)

          with open("app/src/main/res/values/strings.xml", "w") as f:
              f.write(
                  '<resources>'
                  '<string name="app_name">' + escape(name) + '</string>'
                  '<string name="website_url">' + escape(url) + '</string>'
                  '</resources>'
              )

          with open("app/src/main/res/values/colors.xml", "w") as f:
              f.write(
                  '<resources><color name="app_background">' +
                  bg_color +
                  '</color></resources>'
              )

          permission_xml = (
              '<uses-permission android:name="android.permission.INTERNET"/>'
          )

          if "RECORD_AUDIO" in permissions:
              permission_xml += (
                  '<uses-permission android:name="android.permission.RECORD_AUDIO"/>'
              )

          manifest = f"""
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              {permission_xml}

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          """

          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write(manifest)

          # Create launcher icon from uploaded logo or app initial.
          if logo_path:
              if not logo_path.startswith("uploads/logo-"):
                  raise SystemExit("Invalid logo path")
              if not os.path.isfile(logo_path):
                  raise SystemExit("Uploaded logo file not found")
              source = Image.open(logo_path).convert("RGBA")
          else:
              source = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
              draw = ImageDraw.Draw(source)
              letter = (name[:1] or "A").upper()
              try:
                  font = ImageFont.truetype(
                      "DejaVuSans-Bold.ttf", 270
                  )
              except:
                  font = ImageFont.load_default()
              box = draw.textbbox((0, 0), letter, font=font)
              x = (512 - (box[2] - box[0])) / 2
              y = (512 - (box[3] - box[1])) / 2 - box[1]
              draw.text((x, y), letter, fill="white", font=font)

          # Fit the logo inside the Android adaptive icon safe area.
          source.thumbnail((360, 360), Image.Resampling.LANCZOS)

          foreground = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          x = (512 - source.width) // 2
          y = (512 - source.height) // 2
          foreground.alpha_composite(source, (x, y))

          densities = [
              (48, "mdpi"),
              (72, "hdpi"),
              (96, "xhdpi"),
              (144, "xxhdpi"),
              (192, "xxxhdpi")
          ]

          for size, folder in densities:
              path = f"app/src/main/res/mipmap-{folder}"
              os.makedirs(path, exist_ok=True)

              legacy = Image.new(
                  "RGBA", (size, size),
                  tuple(bytes.fromhex(bg_color[1:])) + (255,)
              )
              icon = foreground.resize(
                  (size, size), Image.Resampling.LANCZOS
              )
              legacy.alpha_composite(icon)

              legacy.save(f"{path}/ic_launcher.png")
              icon.save(f"{path}/ic_launcher_foreground.png")

          with open(
              "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", "w"
          ) as f:
              f.write("""
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/app_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          """)

          java = f"""
          package {package};

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.PermissionRequest;
          import android.webkit.WebSettings;
          import android.view.View;
          import android.widget.Toast;

          public class MainActivity extends Activity {{

              WebView web;
              PermissionRequest pendingRequest;

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("{bg_color}"));

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.setWebViewClient(new WebViewClient());

                  web.setWebChromeClient(new WebChromeClient() {{
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {{
                          runOnUiThread(() -> {{
                              boolean audio = false;

                              for (String resource : request.getResources()) {{
                                  if (resource.equals(PermissionRequest.RESOURCE_AUDIO_CAPTURE)) {{
                                      audio = true;
                                  }}
                              }}

                              if (!audio) {{
                                  request.deny();
                                  return;
                              }}

                              if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                                      == PackageManager.PERMISSION_GRANTED) {{
                                  request.grant(request.getResources());
                              }} else {{
                                  pendingRequest = request;
                                  requestPermissions(
                                      new String[]{{Manifest.permission.RECORD_AUDIO}},
                                      101
                                  );
                              }}
                          }});
                      }}
                  }});

                  setContentView(web);
                  web.loadUrl(getString(R.string.website_url));
              }}

              @Override
              public void onRequestPermissionsResult(
                  int requestCode, String[] permissions, int[] grantResults
              ) {{
                  super.onRequestPermissionsResult(
                      requestCode, permissions, grantResults
                  );

                  if (requestCode == 101 && pendingRequest != null) {{
                      if (grantResults.length > 0 &&
                          grantResults[0] == PackageManager.PERMISSION_GRANTED) {{
                          pendingRequest.grant(
                              pendingRequest.getResources()
                          );
                      }} else {{
                          pendingRequest.deny();
                          Toast.makeText(
                              this,
                              "Microphone permission denied",
                              Toast.LENGTH_SHORT
                          ).show();
                      }}
                      pendingRequest = null;
                  }}
              }}

              @Override
              public void onBackPressed() {{
                  if (web != null && web.canGoBack()) {{
                      web.goBack();
                  }} else {{
                      super.onBackPressed();
                  }}
              }}

              @Override
              protected void onDestroy() {{
                  if (web != null) {{
                      web.destroy();
                  }}
                  super.onDestroy();
              }}
          }}
          """

          with open(java_path + "/MainActivity.java", "w") as f:
              f.write(java)
          PY

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: APK-Download
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
