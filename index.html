<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APK Builder Pro</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:#080d19;color:white;
 font-family:Arial,sans-serif
}
.container{max-width:520px;margin:auto}
.header{text-align:center;padding:20px}
.header h1{
 background:linear-gradient(90deg,#00e5ff,#a855f7);
 background-clip:text;color:transparent;font-size:30px
}
.card{
 background:#131d30;border:1px solid #293750;
 border-radius:17px;padding:20px;margin-bottom:17px
}
label{display:block;margin:15px 0 7px;color:#b8c8df}
input{
 width:100%;padding:14px;border-radius:10px;
 border:1px solid #35445f;background:#091222;
 color:white;font-size:15px;outline:none
}
button{
 width:100%;padding:16px;border:0;border-radius:12px;
 background:linear-gradient(90deg,#00c6ff,#8b5cf6);
 color:white;font-size:17px;font-weight:bold;
 margin-top:20px
}
button:disabled{opacity:.5}
.status{
 background:#091222;padding:15px;border-radius:10px;
 margin-top:15px;white-space:pre-wrap;word-break:break-word
}
.small{color:#94a3b8;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div class="container">

 <div class="header">
  <h1>APK BUILDER PRO</h1>
  <p>Website to Android APK</p>
 </div>

 <div class="card">
  <h2>App Configuration</h2>

  <label>App Name</label>
  <input id="appName" placeholder="My Android App">

  <label>Package Name</label>
  <input id="packageName" value="com.example.myapp">

  <label>Website URL</label>
  <input id="websiteUrl" type="url" placeholder="https://example.com">

  <label>Version Name</label>
  <input id="versionName" value="1.0">

  <label>Version Code</label>
  <input id="versionCode" type="number" value="1" min="1">

  <button id="buildButton" onclick="buildAPK()">BUILD APK</button>

  <div class="status" id="status">Ready to build your APK.</div>
 </div>

 <div class="card">
  <h3>Build Information</h3>
  <p class="small">
   ১. App Name এবং Package Name লিখুন।<br>
   ২. Website URL দিন।<br>
   ৩. BUILD APK চাপুন।<br>
   ৪. Build শেষ হলে APK ডাউনলোড করুন।
  </p>
 </div>

</div>

<script>
const WORKER_URL = "https://dawn-hall-5a40apk-bullder-api.shuvo-f29.workers.dev";

let checking = false;

function showStatus(message){
 document.getElementById("status").textContent=message;
}

async function buildAPK(){

 if(checking)return;

 const appName=document.getElementById("appName").value.trim();
 const packageName=document.getElementById("packageName").value.trim();
 const websiteUrl=document.getElementById("websiteUrl").value.trim();
 const versionName=document.getElementById("versionName").value.trim();
 const versionCode=Number(document.getElementById("versionCode").value);

 if(!appName || !packageName || !websiteUrl){
  showStatus("সব তথ্য পূরণ করুন।");
  return;
 }

 if(!/^https:\/\//i.test(websiteUrl)){
  showStatus("সঠিক HTTPS Website URL দিন।");
  return;
 }

 if(!/^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$/.test(packageName)){
  showStatus("সঠিক Package Name দিন। উদাহরণ: com.example.app");
  return;
 }

 if(!Number.isInteger(versionCode)||versionCode<1){
  showStatus("সঠিক Version Code দিন।");
  return;
 }

 if(WORKER_URL==="YOUR_CLOUDFLARE_WORKER_URL"){
  showStatus("Backend এখনো সেটআপ করা হয়নি। পরের ধাপে Backend যুক্ত করতে হবে।");
  return;
 }

 const button=document.getElementById("buildButton");
 button.disabled=true;
 checking=true;

 try{
  showStatus("APK Build শুরু হচ্ছে...");

  const response=await fetch(WORKER_URL+"/build",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    appName,
    packageName,
    websiteUrl,
    versionName,
    versionCode
   })
  });

  const result=await response.json();

  if(!response.ok||!result.runId){
   throw new Error(result.error||"Build শুরু করা যায়নি।");
  }

  showStatus("Build শুরু হয়েছে। অপেক্ষা করুন...");
  await checkBuild(result.runId);

 }catch(error){
  showStatus("সমস্যা: "+error.message);
 }finally{
  button.disabled=false;
  checking=false;
 }
}

async function checkBuild(runId){

 for(let i=0;i<120;i++){

  await new Promise(resolve=>setTimeout(resolve,10000));

  const response=await fetch(
   WORKER_URL+"/status?runId="+encodeURIComponent(runId)
  );

  const result=await response.json();

  if(result.status==="completed"&&result.downloadUrl){
   showStatus("APK তৈরি সম্পন্ন হয়েছে!\n\nডাউনলোড লিংক:\n"+result.downloadUrl);
   return;
  }

  if(result.status==="failed"){
   showStatus("APK তৈরি করা যায়নি। Build Logs পরীক্ষা করতে হবে।");
   return;
  }

  showStatus("APK তৈরি হচ্ছে...\nStatus: "+(result.status||"Waiting"));
 }

 showStatus("সময় বেশি লাগছে। পরে Build Status পরীক্ষা করুন।");
}
</script>
</body>
</html>
